<div class="login-container" @routeAnimations>
  <!-- Radar de carga estilo militar -->
  <div class="radar-wrapper" *ngIf="loading" @spinnerFade>
    <div class="radar">
      <div class="radar-grid"></div> <!-- Nueva cuadrícula militar -->
      <div class="beam"></div> <!-- Haz de radar mejorado -->
      
      <!-- Partículas mejoradas (12 puntos para mejor efecto) -->
      <div class="radar-particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Panel de login con animaciones -->
  <div class="login-panel" @fadeSlide *ngIf="!loading">
    <!-- Logo con efecto de fuego condicional -->
    <img src="assets/img/logo.png" 
         alt="Logo de la aplicación"
         class="app-logo"
         [ngClass]="{ 'fire-effect': fireEffect }"
         (click)="handleLogoClick()"
         role="button"
         tabindex="0">

    <!-- Formulario de login -->
    <form class="login-inputs" (ngSubmit)="login()">
      <input type="email"
             placeholder="Email"
             class="login-input"
             [(ngModel)]="email"
             name="email"
             required
             autocomplete="username">

      <input type="password"
             placeholder="Contraseña"
             class="login-input"
             [(ngModel)]="contrasena"
             name="contrasena"
             required
             autocomplete="current-password">

      <button type="submit" 
              class="login-button"
              [disabled]="!email || !contrasena">
        INGRESAR
      </button>
    </form>
  </div>
</div>

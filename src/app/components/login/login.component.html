<div class="login-container" @routeAnimations>
  <!-- Radar de carga estilo militar -->
  <div class="radar-wrapper" *ngIf="loading" @spinnerFade>
    <div class="radar">
      <div class="radar-grid"></div> 
      <div class="beam"></div> 
      
      <!-- Partículas mejoradas (12 puntos para mejor efecto) -->
      <div class="radar-particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Panel de login con animaciones -->
  <div class="login-panel" @fadeSlide *ngIf="!loading">
    <!-- Logo con efecto de fuego condicional -->
    <img src="assets/img/logo.png" 
         alt="Logo de la aplicación"
         class="app-logo"
         [ngClass]="{ 'fire-effect': fireEffect }"
         (click)="handleLogoClick()"
         role="button"
         tabindex="0">

    <!-- Formulario de login -->
    <form class="login-inputs" (ngSubmit)="login()">
      <input type="email"
             placeholder="Email"
             class="login-input"
             [(ngModel)]="email"
             name="email"
             required
             autocomplete="username">

<div class="password-wrapper">
  <input [type]="showPassword ? 'text' : 'password'"
         placeholder="Contraseña"
         class="login-input"
         [(ngModel)]="contrasena"
         name="contrasena"
         required
         minlength="8"
         autocomplete="current-password" />

          <span class="toggle-password" (click)="showPassword = !showPassword">
            {{ showPassword ? '👁️' : '👁️' }}
          </span>
        </div>

        <small *ngIf="contrasena.length > 0 && contrasena.length < 8" class="password-warning">
          Mín. 8 car., 1 mayús., 1 minús., 1 dígito.
        </small>



      <button type="submit" 
              class="login-button"
              [disabled]="!email || !contrasena">
        INGRESAR
      </button>
    </form>
  </div>
</div>
